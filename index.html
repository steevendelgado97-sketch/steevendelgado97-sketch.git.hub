<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JESUS S. DELGADO-QUIJANO - Resume</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 850px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        header { text-align: center; border-bottom: 2px solid #2c3e50; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { color: #2c3e50; font-size: 2.2em; margin-bottom: 5px; }
        h2 { color: #2980b9; font-size: 1.2em; margin-bottom: 10px; letter-spacing: 1px; }
        .contact { font-size: 0.9em; color: #7f8c8d; }
        
        .section-title { color: #2c3e50; margin: 30px 0 15px 0; font-size: 1.5em; border-left: 4px solid #2980b9; padding-left: 10px; }
        .profile { margin-bottom: 20px; text-align: justify; }

        .accordion {
            background-color: #ecf0f1;
            color: #2c3e50;
            cursor: pointer;
            padding: 15px 20px;
            width: 100%;
            border: none;
            border-radius: 5px;
            text-align: left;
            outline: none;
            font-size: 1.1em;
            font-weight: bold;
            transition: 0.3s;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .accordion:hover { background-color: #d0d6d9; }
        .accordion.active { background-color: #2c3e50; color: #fff; }
        
        .accordion::after { content: '\002B'; font-size: 1.5em; font-weight: bold; transition: transform 0.3s ease; }
        .accordion.active::after { content: '\2212'; transform: rotate(180deg); }

        .job-meta { font-size: 0.85em; font-weight: normal; color: inherit; }

        /* Contenedor principal del panel */
        .panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-in-out;
        }

        /* Clase que se activa con Javascript para mostrar el contenido */
        .panel.show {
            max-height: 1500px; /* Altura máxima holgada para que quepa todo */
        }

        /* Diseño interno del panel para que los márgenes no rompan la animación */
        .panel-content {
            padding: 15px 20px;
            background-color: white;
            border-left: 2px solid #2c3e50;
            margin-left: 10px;
            margin-bottom: 15px;
        }

        .panel ul { padding-left: 20px; }
        .panel li { margin-bottom: 8px; }
        .text-block { padding-top: 10px; color: #555; }

        .skills-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
        .skills-category { background: #f9f9f9; padding: 20px; border-radius: 5px; border-left: 3px solid #2980b9; }
